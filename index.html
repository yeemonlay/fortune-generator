<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your 2026 Fortune 🧧</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Noto Serif SC', serif;
      background: radial-gradient(circle at top, #b30000, #7a0000);
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid #ffd700;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 24px 20px 30px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .year {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    .divider {
      height: 2px;
      width: 60%;
      margin: 16px auto 20px;
      background: linear-gradient(to right, transparent, #ffd700, transparent);
    }

    .fortune-box {
      background: rgba(255, 215, 0, 0.08);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .emoji {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    footer {
      font-size: 0.75rem;
      color: #f3d37a;
      opacity: 0.85;
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="emoji">🧧🐎✨</div>
    <h1>Your Fortune Awaits</h1>
    <div class="year">Chinese New Year 2026</div>

    <div class="divider"></div>

    <div class="fortune-box">
      <!-- Fortune Generator Embed -->
      <div class="embed-fungen">
        <script src="https://fungenerators.com/extensions/embed/v1/fungen.js"></script>
        <script>
          FunGen.Embed.render({ context: 'text', toolId: 'fortune-cookie' });
        </script>
        <noscript>
          Please enable JavaScript to view the
          <!-- <a href="https://fungenerators.com/random/text/fortune-cookie">
            Random Fortune Generator
          </a>. -->
        </noscript>
        <div class="light-text" style="text-decoration: none; color:#ccc; text-align: right; padding-right: 10px; margin-top: 6px;">
          <a href="https://fungenerators.com/random/text/fortune-cookie"
             title="Powered by Random Fortune Generator from fungenerators.com"
             style="text-decoration: none; color:#ccc;">
                  </a>
        </div>
      </div>
    </div>

    <footer>
      Wishing you luck, prosperity & joy in the Year of the Horse 🐎
    </footer>
  </div>

</body>
</html>
